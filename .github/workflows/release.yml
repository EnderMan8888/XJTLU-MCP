name: Publish Windows release
on:
  push:
    branches: [main]
    paths: ['releases/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check app and Agent versions
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock.version -ne $version -or $lock.packages[''].version -ne $version) {
            throw "package-lock.json must use the app version $version"
          }
          $agentManifests = @(
            'codex-plugin/plugins/xjtlu-campus/.codex-plugin/plugin.json',
            'src/main/assets/deepseek-harness/xjtlu-mcp/package.json'
          )
          foreach ($manifest in $agentManifests) {
            if ((Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).version -ne $version) {
              throw "$manifest must use the app version $version"
            }
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Install Electron runtime on build runner
        run: npm run install:electron
      - name: Build Windows full and Lite packages
        run: npm run package:win
      - name: Publish three Windows packages and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "dist/XJTLU-MCP-$version-win-x64-setup.exe"
          $zip = "dist/XJTLU-MCP-$version-win-x64.zip"
          $lite = "dist/XJTLU-MCP-$version-win-x64-lite-setup.exe"
          $checksums = "dist/SHA256SUMS.txt"
          foreach ($asset in @($setup, $zip, $lite, $checksums)) {
            if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset $asset" }
          }
          gh release create "v$version" $setup $zip $lite $checksums --target $env:GITHUB_SHA --title "XJTLU-MCP V$version" --notes-file "releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

