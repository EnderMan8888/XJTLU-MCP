name: Publish Windows release
on:
  push:
    branches: [main]
    paths: ['releases/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Electron runtime on build runner
        run: npm run install:electron
      - name: Build Windows portable package
        run: npm run package:win
      - name: Publish V1.0 with download and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" "dist/XJTLU-MCP-$version-win-x64.zip" "dist/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "XJTLU-MCP V$version" --notes-file "releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

